<!DOCTYPE html>
<html lang="pt-BR">

<head>

<link rel="stylesheet" type="text/css" href="page.css">

<meta charset="utf-8">
<meta name="author" content="Pedro Schumacker, Gabriel Jardim, Rafael Jardim e Guilherme Tavora">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>INOVA</title>

<style>

*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body{
    font-family: Arial, sans-serif;
    background-color: #f5f5f5;
    padding: 20px;
}

/* TOPO */
article{
    width: 100%;
    min-height: 60px;

    background: skyblue;

    border-radius: 20px;

    box-shadow: 10px 10px 5px grey;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 15px;

    margin-bottom: 30px;
}

h1{
    text-align: center;
}

header{
    text-align: center;
    margin-bottom: 20px;
}

h3{
    text-align: center;
    line-height: 1.6;
    margin-bottom: 15px;
}

/* MENU */
nav{
    display: flex;
    justify-content: center;
    margin-top: 30px;
}

ul{
    list-style: none;
    width: 100%;
    max-width: 400px;
}

li{
    margin-bottom: 15px;
}

li a{
    display: block;

    background-color: white;

    color: black;

    text-decoration: none;

    padding: 30px;

    border-radius: 25px;

    text-align: center;

    border: 1px solid #ccc;

    transition: 0.3s;
}

li a:hover{
    background-color: skyblue;
}

/* RODAPÉ */
footer{
    margin-top: 50px;
    padding: 20px;
    background: #eee;
    text-align: center;
    border-radius: 10px;
}

/* RESPONSIVIDADE */
@media (max-width: 768px){

    body{
        padding: 15px;
    }

    h1{
        font-size: 24px;
    }

    h3{
        font-size: 16px;
    }

    ul{
        max-width: 100%;
    }

    li a{
        width: 100%;
    }
}

</style>

</head>

<body>

<article>
    <h1>INOVA</h1>
</article>

<h3>
Clique aqui em baixo para jogar nosso jogo interativo
</h3>

<li>
<a href>JOGAR</a>
</li>
